services:
  unbound:
    image: klutchell/unbound:latest
    container_name: unbound
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "drill-hc", "@127.0.0.1", "dnssec.works"] # DevSkim: ignore DS162092
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 30s
    networks:
      dns:
        ipv4_address: ${UNBOUND_IP:?Set UNBOUND_IP in .env}

  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    restart: unless-stopped
    depends_on:
      unbound:
        condition: service_healthy
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "80:80/tcp"
      - "443:443/tcp"
    environment:
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD:?Set PIHOLE_PASSWORD in .env}
      FTLCONF_dns_listeningMode: ALL
      FTLCONF_dns_upstreams: unbound
      FTLCONF_dns_dnssec: "false"
      FTLCONF_dns_queryLogging: "false"
      FTLCONF_misc_privacylevel: 3
    volumes:
      - ./etc-pihole:/etc/pihole
      - ./adlists.list:/etc/pihole/adlists.list:ro
    dns:
      - ${UNBOUND_IP:?Set UNBOUND_IP in .env}
    cap_add:
      - SYS_NICE
    networks:
      dns:
        ipv4_address: ${PIHOLE_IP:?Set PIHOLE_IP in .env}

networks:
  dns:
    driver: bridge
    ipam:
      config:
        - subnet: ${DNS_SUBNET:?Set DNS_SUBNET in .env}
