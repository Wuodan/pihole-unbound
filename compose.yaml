services:
  unbound:
    image: klutchell/unbound:latest
    container_name: unbound
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "drill-hc", "@127.0.0.1", "dnssec.works"] # DevSkim: ignore DS162092
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 30s
    networks:
      dns:
        ipv4_address: 172.31.0.2

  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    restart: unless-stopped
    depends_on:
      unbound:
        condition: service_healthy
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "80:80/tcp"
      - "443:443/tcp"
    environment:
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD:?Set PIHOLE_PASSWORD in .env}
      FTLCONF_dns_listeningMode: ALL
      FTLCONF_dns_upstreams: unbound
      FTLCONF_dns_dnssec: "false"
      FTLCONF_dns_queryLogging: "false"
      FTLCONF_misc_privacylevel: 3
    volumes:
      - ./etc-pihole:/etc/pihole
    dns:
      - 172.31.0.2
    cap_add:
      - SYS_NICE
    networks:
      dns:
        ipv4_address: 172.31.0.3

networks:
  dns:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/24
